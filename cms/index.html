<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Destino España Admin — CMS</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app-container">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-content">
        <div class="brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M12 2L2 7l10 5 10-5-10-5zm0 9.5l-8-4v6.5l8 4 8-4v-6.5l-8 4z"/>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">Destino España</h1>
            <span class="brand-badge">Admin CMS</span>
          </div>
        </div>
        <div class="header-actions">
          <button id="btn-open-versions" class="btn-icon" title="Historial de versiones" aria-label="Versiones">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
            </svg>
          </button>
          <button id="btn-logout" class="btn-icon btn-logout" title="Cerrar sesión" aria-label="Salir">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="main-content">
      <!-- Section: Dashboard -->
      <section id="view-dashboard" class="module-view active">
        <!-- Rendered by dashboard.js -->
      </section>

      <!-- Section: Cintillo -->
      <section id="view-cintillo" class="module-view">
        <!-- Rendered by cintillo.js -->
      </section>

      <!-- Section: Promociones -->
      <section id="view-promociones" class="module-view">
        <!-- Rendered by promociones.js -->
      </section>

      <!-- Section: Calculadora -->
      <section id="view-calculadora" class="module-view">
        <!-- Rendered by calculadora.js -->
      </section>

      <!-- Section: Trámites -->
      <section id="view-tramites" class="module-view">
        <!-- Rendered by tramites.js -->
      </section>

      <!-- Section: Configuración -->
      <section id="view-config" class="module-view">
        <!-- Rendered by config.js -->
      </section>
    </main>

    <!-- Bottom Navigation Bar (Mobile-first) -->
    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="nav-item active" data-target="dashboard" aria-label="Dashboard">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
          </svg>
        </div>
        <span class="nav-label">Dashboard</span>
      </button>

      <button class="nav-item" data-target="cintillo" aria-label="Cintillo">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2zm0-4H7V7h10v2zm-4 8H7v-2h6v2z"/>
          </svg>
        </div>
        <span class="nav-label">Cintillo</span>
      </button>

      <button class="nav-item" data-target="promociones" aria-label="Promociones">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/>
          </svg>
        </div>
        <span class="nav-label">Promociones</span>
      </button>

      <button class="nav-item" data-target="calculadora" aria-label="Calculadora">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-6 2h4v2h-4V5zm-6 0h4v2H7V5zm0 4h4v2H7V9zm0 4h4v2H7v-2zm0 4h4v2H7v-2zm6-8h4v2h-4V9zm0 4h4v2h-4v-2zm0 4h4v2h-4v-2z"/>
          </svg>
        </div>
        <span class="nav-label">Calculadora</span>
      </button>

      <button class="nav-item" data-target="tramites" aria-label="Trámites">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
          </svg>
        </div>
        <span class="nav-label">Trámites</span>
      </button>

      <button class="nav-item" data-target="config" aria-label="Configuración">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </div>
        <span class="nav-label">Config</span>
      </button>
    </nav>
  </div>

  <!-- Modal Container for Versiones and Promo Modal Preview/Editor -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div id="modal-dialog" class="modal-dialog">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">Título Modal</h2>
        <button id="btn-close-modal" class="btn-close" aria-label="Cerrar">&times;</button>
      </div>
      <div id="modal-body" class="modal-body">
        <!-- Dynamic content -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/cintillo.js"></script>
  <script src="js/modules/promociones.js"></script>
  <script src="js/modules/calculadora.js"></script>
  <script src="js/modules/tramites.js"></script>
  <script src="js/modules/versions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
