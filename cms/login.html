<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Acceso — Destino España Admin</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="#EC1313">
            <path d="M12 2L2 7l10 5 10-5-10-5zm0 9.5l-8-4v6.5l8 4 8-4v-6.5l-8 4z"/>
          </svg>
        </div>
        <h1 class="login-title">Destino España</h1>
        <p class="login-subtitle">Panel Administrativo R2 CMS</p>
      </div>

      <div class="login-notice">
        <div class="notice-badge">Seguridad Restringida</div>
        <p>Sistema de gestión exclusivo para la app móvil. Acceso autorizado únicamente para la cuenta administradora:</p>
        <code>eblito.lopez@gmail.com</code>
      </div>

      <div class="login-actions">
        <button id="btn-google-login" class="btn-google">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Continuar con Google</span>
        </button>
      </div>

      <div id="login-error" class="login-error hidden">
        <span id="login-error-text"></span>
      </div>

      <div class="login-footer">
        <p>Destino España &copy; 2026 &bull; Cloudflare R2 JSON Engine</p>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Verificar si ya hay sesión activa
      if (Auth.isAuthenticated()) {
        window.location.href = 'index.html';
        return;
      }

      const loginBtn = document.getElementById('btn-google-login');
      loginBtn.addEventListener('click', () => {
        Auth.loginWithGoogle();
      });

      // Chequear error en URL
      const urlParams = new URLSearchParams(window.location.search);
      const error = urlParams.get('error');
      if (error) {
        const errorBox = document.getElementById('login-error');
        const errorText = document.getElementById('login-error-text');
        errorText.textContent = decodeURIComponent(error);
        errorBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
